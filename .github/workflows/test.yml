name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is x86-64, macos-latest is arm64. Windows has no
        # mojolearn wheel and installs CatBoost by the pyproject marker.
        # Python: the oldest supported, a middle one and the newest.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    env:
      WHOWHEN_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q -rs

  coverage:
    # One worker, so every fit runs in the measured process.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WHOWHEN_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" pytest-cov
      - name: Test with coverage
        run: python -m pytest -q --cov=whowhen --cov-report=term-missing

  package:
    # Build the files that go to PyPI, install the wheel into a clean
    # environment and run the demo with the default classifier. macOS is
    # left out: mojolearn crashes on GitHub's hosted Macs.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      WHOWHEN_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install the wheel and run the demo
        shell: bash
        run: |
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          whowhen demo
