[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whowhen"
version = "0.1.1"
description = "Audit panel data for identity and timing signals a model can exploit without predicting anything"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Andrew Hendel"}]
requires-python = ">=3.10"
keywords = ["data leakage", "evaluation", "panel data", "dataset audit", "time series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "threadpoolctl>=3.1",
    # The scorer: mojolearn where it ships a wheel, CatBoost elsewhere.
    # Move the second marker's platforms to mojolearn as its wheels appear.
    "mojolearn>=0.8.66; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "catboost>=1.2; (sys_platform != 'darwin' or platform_machine != 'arm64') and (sys_platform != 'linux' or platform_machine != 'x86_64')",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0"]
test = ["pytest>=7", "catboost>=1.2", "pyarrow>=14.0"]

[project.urls]
Repository = "https://github.com/mojolearn/whowhen"

[project.scripts]
whowhen = "whowhen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
